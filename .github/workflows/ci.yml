name: PrismUp CI

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

jobs:
  on-linux-x86-64:

    runs-on: ubuntu-24.04
    steps:
      - name: Unix details
        run: uname -a

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Installation of Just
        uses: extractions/setup-just@v4

      - name: Build of PrismUp
        run: just build

      - name: Test of PrismUp
        run: just test

      - name: First run
        run: target/debug/prismup

      - name: Run Prism compiler
        run: ~/.prismup/bin/prism --version

      - name: Install a specific version of Prism
        run: target/debug/prismup --install-version 0.10.0

      - name: Run the Prism compiler just added
        run: ~/.prismup/bin/prism-0.10.0 --version

      - name: Show Prism versions status
        run: target/debug/prismup --versions-list

      - name: Refuse a Prism version released without a binary for this platform
        run: '! target/debug/prismup --install-version 0.1.0'

      - name: Refuse several actions at the same time
        run: '! target/debug/prismup --upgrade --current-version'

  on-linux-arm:

    runs-on: ubuntu-24.04-arm
    steps:
      - name: Unix details
        run: uname -a

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Installation of Just
        uses: extractions/setup-just@v4

      - name: Build of PrismUp
        run: just build

      - name: Test of PrismUp
        run: just test

      - name: First run
        run: target/debug/prismup

      - name: Run Prism compiler
        run: ~/.prismup/bin/prism --version

      - name: Install a specific version of Prism
        run: target/debug/prismup --install-version 0.10.0

      - name: Run the Prism compiler just added
        run: ~/.prismup/bin/prism-0.10.0 --version

      - name: Show Prism versions status
        run: target/debug/prismup --versions-list

      - name: Refuse a Prism version released without a binary for this platform
        run: '! target/debug/prismup --install-version 0.1.0'

      - name: Refuse several actions at the same time
        run: '! target/debug/prismup --upgrade --current-version'

  on-macos:

    runs-on: macos-latest
    steps:
      - name: Unix details
        run: uname -a

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Installation of Just
        uses: extractions/setup-just@v4

      - name: Build of PrismUp
        run: just build

      - name: Test of PrismUp
        run: just test

      - name: First run
        run: target/debug/prismup

      - name: Run Prism compiler
        run: ~/.prismup/bin/prism --version

      - name: Set a specific version of Prism
        run: target/debug/prismup --set-version 0.18.0

      - name: Run the Prism compiler just added
        run: ~/.prismup/bin/prism --version

      - name: Show Prism versions status
        run: target/debug/prismup --versions-list

      - name: Refuse a Prism version released without a binary for this platform
        run: '! target/debug/prismup --install-version 0.1.0'

      - name: Refuse several actions at the same time
        run: '! target/debug/prismup --upgrade --current-version'

